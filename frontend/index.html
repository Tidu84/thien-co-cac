<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiên Cơ Các - Vận Mệnh & Tướng Pháp AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(234, 179, 8, 0.4)); }
      50% { filter: drop-shadow(0 0 28px rgba(234, 179, 8, 0.85)); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes fogDrift1 {
      0% { transform: translate(-5%, 0) scale(1); opacity: 0.25; }
      50% { transform: translate(6%, -10px) scale(1.08); opacity: 0.45; }
      100% { transform: translate(-5%, 0) scale(1); opacity: 0.25; }
    }
    @keyframes fogDrift2 {
      0% { transform: translate(6%, 0) scale(1.05); opacity: 0.2; }
      50% { transform: translate(-6%, -15px) scale(0.98); opacity: 0.4; }
      100% { transform: translate(6%, 0) scale(1.05); opacity: 0.2; }
    }
    .fog-anim-1 { animation: fogDrift1 18s ease-in-out infinite; }
    .fog-anim-2 { animation: fogDrift2 24s ease-in-out infinite; }
    .pulse-glow { animation: pulseGlow 3s infinite ease-in-out; }
    .float-slow { animation: floatSlow 4s infinite ease-in-out; }
    .font-mystic { font-family: 'Cinzel Decorative', 'Playfair Display', serif; }
    .font-serif-title { font-family: 'Playfair Display', serif; }
    .font-body { font-family: 'Quicksand', sans-serif; }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0c0a1f; }
    ::-webkit-scrollbar-thumb { background: #3730a3; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
  </style>
  </head>
<body class="bg-slate-950 text-slate-100 font-body selection:bg-amber-500/30 selection:text-amber-200 min-h-screen overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
